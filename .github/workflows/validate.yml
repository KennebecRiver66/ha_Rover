name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          # No checks ignored. The brands check used to be, because it needed
          # artwork merged into home-assistant/brands and nothing here could
          # satisfy it; it is satisfied now by the brand/ images shipped inside the
          # integration. See docs/brands-submission.md.

  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Pinned to the Python that the pinned Home Assistant needs; see
          # requirements_test.txt.
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install test dependencies
        run: pip install -r requirements_test.txt
      - name: Run tests
        run: |
          python -m pytest \
            --cov=custom_components/rover_client \
            --cov-report=term-missing
      - name: Check translations/en.json is generated from strings.json
        run: python scripts/sync_translations.py --check
